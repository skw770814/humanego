schema_version: 1

paths:
  raw_dir: data/raw
  work_dir: work
  output_dir: lerobot_datasets
  assets_dir: assets
  models_dir: models
  # Runtime source is a minimal in-project closure. Model weights live under
  # models/ and are prepared by this project's bootstrap script.
  humanego_project: third_party/humanego_runtime
  hand_swap_project: third_party/hand_swap_runtime
  egodex_project: third_party/egodex_runtime

task:
  instruction: "First, place the red cube into the black metal pen holder, then place the yellow cube into the black metal pen holder."
  objects:
    - instance_id: obj1
      category: "black, metal pen holder"
      prompt: "a black, metal pen holder ."
      graspable: false
    - instance_id: obj2
      category: "red cube"
      prompt: "a red cube ."
      graspable: true
    - instance_id: obj3
      category: "yellow cube"
      prompt: "a yellow cube ."
      graspable: true

timeline:
  # zh_test raw body/hands are 43--46 Hz and stereo camera is 30--33 Hz.
  # Mode2 therefore builds a native 30 Hz nearest-neighbour control grid.
  control_hz: 30.0
  # Capture clocks fluctuate slightly around their nominal rate. Allow minor
  # nearest-neighbour upsampling, while still rejecting genuinely low-rate data.
  source_rate_tolerance_hz: 1.0
  max_camera_gap_ms: 80.0
  max_tracking_gap_ms: 80.0
  # Complete Step1 episodes must retain at least this fraction of fully valid
  # body + left hand + right hand + camera matches on the 30 Hz grid.
  minimum_aligned_valid_ratio: 0.95

camera:
  eye: left
  head_pose_source: tracking
  # HDF5 属性声明 extrinsics_left 是 T_head_camera，但仍必须用标定板验方向。
  extrinsic_direction: head_to_camera
  require_verified_extrinsics: true
  calibration_verified: false
  # PICO factory K/extrinsics are accepted only after rig + hand projection self-QA.
  accept_sdk_factory_extrinsics: true
  # Hands may legitimately leave the FOV. Positive optical depth is the hard
  # direction test; in-frame ratio is only a looser plausibility test.
  minimum_hand_projection_ratio: 0.50
  minimum_hand_positive_depth_ratio: 0.95
  minimum_scan_translation_m: 0.08
  minimum_scan_rotation_deg: 12.0
  maximum_stereo_delta_ms: 8.0

depth:
  method: stereo_sgbm
  min_depth_m: 0.15
  max_depth_m: 4.0
  num_disparities: 128
  block_size: 7
  uniqueness_ratio: 10
  speckle_window_size: 80
  speckle_range: 2
  # PXR_CameraImage supplies PINHOLE images. Rectify the stereo pair with zero
  # lens distortion, then map depth back to the original left-image pixels.
  rectify_pinhole_stereo: true
  left_right_consistency: true
  left_right_max_diff_px: 1.0
  minimum_dense_coverage: 0.15
  minimum_epipolar_matches: 50
  maximum_epipolar_p95_px: 1.5
  # The one-click QA video may continue under these looser bounds, but the
  # resulting depth remains explicitly non-deployable.
  debug_minimum_epipolar_matches: 30
  # Legacy P95 limits remain in snapshots/reports for comparison. Debug
  # acceptance uses RANSAC inliers plus robust median/P90 statistics below.
  debug_maximum_epipolar_p95_px: 2.5
  debug_maximum_sgbm_lk_disparity_p95_px: 2.5
  debug_minimum_epipolar_ransac_inlier_ratio: 0.50
  debug_maximum_epipolar_median_px: 1.0
  debug_maximum_epipolar_p90_px: 2.0
  debug_maximum_sgbm_lk_disparity_median_px: 1.0
  patch_radius_px: 3
  minimum_keypoint_depths: 3

mode2:
  hand_retargeter: geometric
  max_repair_gap: 2
  smooth_window: 5
  max_wrist_jump_m: 0.10
  max_pelvis_jump_m: 0.15
  max_hand_keypoint_jump_m: 0.08
  maximum_eef_speed_m_s: 2.0
  maximum_eef_rotation_deg_s: 720.0
  maximum_brainco_speed_s: 5.0
  # Binary grasp supplement from retargeted BrainCo commands. Each selected
  # motor is in [0,1], where 1 means closed.
  grasp_signal_fingers: [thumb_flex, index]
  grasp_close_hi: 0.30
  grasp_open_lo: 0.30
  grasp_min_dwell_ticks: 3
  # Retain the older index-only heuristic as a video/QA comparison signal.
  grasp_diagnostic_index_threshold: 0.25
  grasp_diagnostic_min_dwell_ticks: 5
  # Recommended adaptive binary signal. The index motor is normalized per
  # side/episode because thumb_flex also changes during non-grasp hand poses.
  grasp_robust_low_quantile: 0.10
  grasp_robust_high_quantile: 0.95
  grasp_robust_minimum_range: 0.12
  grasp_robust_median_window: 5
  grasp_robust_close_hi: 0.35
  grasp_robust_open_lo: 0.25
  grasp_robust_confirm_ticks: 5
  grasp_robust_minimum_state_ticks: 12

perception:
  python: .venv/bin/python
  max_entities: 8
  keypoints_per_object: 24
  # Frame-0 probe: true red=0.557, yellow-as-red false positive=0.368.
  dino_box_threshold: 0.50
  pose_method: vlm
  triangulation_step: 2
  visibility_threshold: 0.5
  grasp_distance_m: 0.035
  latch_distance_m: 0.20
  # Main HumanEgo ICT experiments use camera-frame spatial tokens; keep empty
  # unless intentionally reproducing an anchor-frame ablation.
  anchor_category: ""
  instance_counts:
    "black, metal pen holder": 1
    "red cube": 1
    "yellow cube": 1
  minimum_instance_area_px: 400
  # SAM2 remains an auxiliary identity/region signal. It only rejects
  # CoTracker points that leave the object; it never estimates pose itself.
  sam2_pose_gate_enabled: true
  sam2_pose_gate_dilation_px: 4
  sam2_pose_gate_minimum_area_ratio: 0.10
  sam2_pose_gate_maximum_area_ratio: 4.0
  sam2_pose_gate_minimum_score: 0.80
  minimum_pose_inlier_ratio: 0.50
  maximum_object_translation_step_m: 0.04
  maximum_object_rotation_step_deg: 25.0
  object_translation_smoothing: 0.45
  object_translation_median_window: 3
  object_translation_motion_deadband_px: 2.0
  object_translation_full_response_px: 7.0
  object_rotation_smoothing: 0.20
  # Untextured cubes have 24 geometrically equivalent proper rotations.
  rotation_symmetry_categories: ["red cube", "yellow cube"]
  object_prompts:
    "black, metal pen holder": "a black, metal pen holder ."
    "red cube": "a red cube ."
    "yellow cube": "a yellow cube ."
  # Missing internal runtime files are fatal for formal processing. Enable only
  # when explicitly testing downstream data contracts without real perception.
  allow_debug_fallback: false

relations:
  translation_scale_m: 0.50
  distance_bins_m: [0.06, 0.15, 0.35]
  approach_speed_m_s: 0.04
  contact_distance_m: 0.06

visual:
  # Raw camera0 is the current training image. brainco_swap remains an optional
  # Step3-backed export source and must pass exact frame-count QA.
  enabled: false
  source: raw
  python: .venv/bin/python

export:
  variants: [continuous, binary]
  repo_id_prefix: task1_zcf_raw
  robot_type: unitree_g1_brainco_revo2
  video_codec: mp4v
  chunks_size: 1000

realtime:
  camera_hz: 30.0
  tracker_hz: 20.0
  detector_hz: 2.0
  orientation_hz: 0.2
  policy_hz: 10.0
  control_hz: 30.0
  max_observation_age_ms: 150.0
  lost_timeout_ms: 500.0

visualization:
  enabled: true
  max_chart_points: 800
  preview_frames: 8
  jpeg_quality: 82
